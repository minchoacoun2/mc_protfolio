<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRU</title>
  <link rel="icon" type="image/png" href="./images/stru_favion.png">

   <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      overflow-x: hidden;
      background: #ffffff;
    }

    main {
      width: min(1400px, 90vw);
      margin: 0 auto;
    }

    .stru-image {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      object-fit: contain;
    }

    @media (max-width: 700px) {
      main {
        width: 94vw;
      }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="stru-image"
      src="./images/stru_01.png"
      alt="STRU 브랜드 소개"
    >

    <img
      class="stru-image"
      src="./images/stru_02.png"
      alt="STRU 브랜드 키워드, 로고 및 컬러"
      loading="lazy"
    >

    <img
      class="stru-image"
      src="./images/stru_03.png"
      alt="STRU 브랜드 콘셉트 및 목표"
      loading="lazy"
    >

    <img
      class="stru-image"
      src="./images/stru_04.png"
      alt="STRU 브랜드 응용 디자인"
      loading="lazy"
    >

    <img
      class="stru-image"
      src="./images/stru_05.png"
      alt="STRU 브랜드 패키지와 광고 디자인"
      loading="lazy"
    >

    <img
      class="stru-image"
      src="./images/stru_06.png"
      alt="STRU 웹사이트, 소셜 미디어 및 패키지 디자인"
      loading="lazy"
    >

    <img
      class="stru-image"
      src="./images/stru_img.png"
      alt="STRU 쇼핑백 디자인"
      loading="lazy"
    >

    <img
      class="stru-image"
      src="./images/stur_07.png"
      alt="STRU 브랜드 응용 디자인과 Thank you"
      loading="lazy"
    >
  </main>
</body>
</html>
