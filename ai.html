<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>아이봄아동병원</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: 320px;
      overflow-x: hidden;
      background: #fff;
    }

    .ai-concept {
      width: calc(100% - 80px);
      max-width: 1400px;
      margin: 0 auto;
    }

    .ai-concept img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 700px) {
      .ai-concept {
        width: calc(100% - 28px);
      }
    }
  </style>
</head>

<body>
  <main class="ai-concept">
    <img
      src="./images/ai_01.png"
      alt="아이봄아동병원 브랜드 콘셉트와 프로젝트 목표"
    >

    <img
      src="./images/ai_02.png"
      alt="AI 활용 기록과 이미지 생성 과정"
      loading="lazy"
    >

    <img
      src="./images/ai_03.png"
      alt="AI 이미지 수정 전후 비교"
      loading="lazy"
    >

    <img
      src="./images/ai_04.png"
      alt="아이봄아동병원 최종 디자인 결과물"
      loading="lazy"
    >
  </main>
</body>
</html>
